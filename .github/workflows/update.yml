name: Update data and site

# GitHub runs scheduled workflows late and drops many of them, so the schedule asks every 15 minutes
# and a quick check updates only when the published data is over 50 minutes old: about once an hour.
# "auto" decides the rest: a full sweep (7/30-day searches, official datasets) when the last one is
# over 20 hours old, otherwise the last-24-hours searches.
# On a push to main: publish the new code with the latest data (no fetching).
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = update if the data is over 50 min old; full = everything now; hourly = last 24 hours now"
        type: choice
        options: [auto, full, hourly]
        default: auto

permissions:
  contents: write   # save data to the data branch
  pages: write      # publish the site
  id-token: write
  actions: write    # keep this schedule switched on (last step)

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Is an update due?
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.mode }}" = "full" ] || [ "${{ inputs.mode }}" = "hourly" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          age=$(curl -s --max-time 20 "https://niyosh.github.io/tnwatch/data/version.json?t=$(date +%s)" \
            | python3 -c "import json, sys, datetime as d; t = d.datetime.fromisoformat(json.load(sys.stdin)['generatedAt']); print(int((d.datetime.now(d.timezone.utc) - t).total_seconds() // 60))" \
            || echo 9999)
          echo "The published data is $age minutes old"
          if [ "$age" -ge 50 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  update:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Choose what to do
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then mode="${{ inputs.mode }}"
          elif [ "${{ github.event_name }}" = "push" ]; then mode="deploy"
          else mode="auto"; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode"

      # The stored stories live on the "data" branch (one commit, replaced every run),
      # so the main branch only changes when the code does.
      - name: Restore data
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data; then git archive FETCH_HEAD | tar -x -C data; fi

      - name: Test the classifier
        run: python scripts/test_classify.py

      - name: Fetch from public sources
        if: steps.mode.outputs.mode != 'deploy'
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: python scripts/fetch_data.py --mode ${{ steps.mode.outputs.mode }}

      - name: Draw the share image
        run: |
          pip install --quiet pillow
          python scripts/make_card.py

      - name: Save data
        if: steps.mode.outputs.mode != 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data
          git init -q -b data
          git config user.name "tn-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Build the site
        run: |
          mkdir -p _site/data
          cp -r index.html css js assets _site/
          cp data/auto.js data/auto.json data/version.json data/stories.csv data/card.png _site/data/
          # previews use the fresh share image; the run id makes apps fetch the new one
          sed -i "s|assets/og.png|data/card.png?v=${GITHUB_RUN_ID}|g" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub switches off schedules in repositories with no activity for 60 days;
      # re-enabling the workflow resets that clock.
      - name: Keep the schedule switched on
        if: github.event_name == 'schedule' || steps.mode.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/enable" || echo "could not refresh the schedule"
